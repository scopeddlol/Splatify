name: splatify

x-app: &app
  image: ${SPLATIFY_IMAGE:?Set SPLATIFY_IMAGE to a reviewed image}
  environment:
    NODE_ENV: production
    DATABASE_URL: postgresql://splatify:${POSTGRES_PASSWORD:?Set a strong URL-safe POSTGRES_PASSWORD}@db:5432/splatify
    APP_URL: ${APP_URL:?Set the canonical HTTPS APP_URL}
    ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL}
    ADMIN_NAME: ${ADMIN_NAME:?Set ADMIN_NAME}
    ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set a unique ADMIN_PASSWORD of at least 12 characters}
    TRUST_PROXY: ${TRUST_PROXY:-0}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
  # Fail closed before either migrations or the web process can start.
  entrypoint:
    - /bin/sh
    - -ec
    - |
      node -e '
        const e = process.env;
        const placeholder = /replace|change.?me|example|placeholder/i;
        if (!/^[A-Za-z0-9_-]{32,}$/.test(e.POSTGRES_PASSWORD || "") || placeholder.test(e.POSTGRES_PASSWORD)) throw Error("Set a non-placeholder, URL-safe database password of at least 32 characters");
        if (!e.ADMIN_PASSWORD || e.ADMIN_PASSWORD.length < 12 || e.ADMIN_PASSWORD.length > 128 || placeholder.test(e.ADMIN_PASSWORD)) throw Error("Set a non-placeholder admin password of 12-128 characters");
        if (!e.ADMIN_EMAIL || !e.ADMIN_EMAIL.includes("@") || placeholder.test(e.ADMIN_EMAIL)) throw Error("Set a real ADMIN_EMAIL");
        if (new URL(e.APP_URL).protocol !== "https:") throw Error("Production APP_URL must use HTTPS");
        if (!["0", "1"].includes(e.TRUST_PROXY)) throw Error("TRUST_PROXY must be 0 or 1");
      '
      exec "$$@"
    - --

services:
  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: splatify
      POSTGRES_DB: splatify
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a strong URL-safe POSTGRES_PASSWORD}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        case "$$POSTGRES_PASSWORD" in
          *[!A-Za-z0-9_-]*|*REPLACE*|*replace*|*CHANGEME*|*changeme*|*placeholder*)
            echo 'Set a non-placeholder URL-safe POSTGRES_PASSWORD' >&2; exit 1 ;;
        esac
        [ "$${#POSTGRES_PASSWORD}" -ge 32 ] || { echo 'POSTGRES_PASSWORD must be at least 32 characters' >&2; exit 1; }
        exec docker-entrypoint.sh "$$@"
      - --
    command: [postgres]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U splatify -d splatify']
      interval: 5s
      timeout: 5s
      retries: 20
    # PostgreSQL is intentionally not published on the host.

  migrate:
    <<: *app
    restart: "no"
    command: [./node_modules/.bin/tsx, scripts/migrate.ts]
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy

  web:
    <<: *app
    restart: unless-stopped
    init: true
    command: [node, server.js]
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  caddy:
    image: caddy:2-alpine
    profiles: [tls]
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
