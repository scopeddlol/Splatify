name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: splatify
          POSTGRES_PASSWORD: ci-only-disposable-password
          POSTGRES_DB: splatify_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U splatify -d splatify_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://splatify:ci-only-disposable-password@127.0.0.1:5432/splatify_test
      TEST_DATABASE_URL: postgresql://splatify:ci-only-disposable-password@127.0.0.1:5432/splatify_test
      APP_URL: http://localhost:3000
      ADMIN_EMAIL: admin@splatify.test
      ADMIN_NAME: CI Administrator
      ADMIN_PASSWORD: ci-only-admin-password-not-for-production
      TRUST_PROXY: "0"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run db:migrate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
